syntax = "proto3";

package streaming.v1;

// Bidirectional-streaming example. The client streams messages and the server
// streams a reply per message: the same text upper-cased, with the client's
// sequence number preserved. Regenerate the committed Python stubs with
// `python proto/regen_proto.py` (shared with the api_grpc overlay).
service ChatService {
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

message ChatMessage {
  uint32 seq = 1;
  string text = 2;
}
