name: generator-ci

# CI for the generator repository itself (not for generated projects).
# Fast, uv-cached. Determinism and clean `copier update` are the two properties
# these jobs defend.

on:
  push:
    branches: [main, "development", "relase/*", "release/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: generator-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.10"          # generator dev toolchain (registry meta pins this)
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      - name: ruff
        run: uv run ruff check msvc_gen scripts tests
      - name: ruff format check
        run: uv run ruff format --check msvc_gen scripts tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      - name: mypy
        run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      - name: pytest
        run: uv run pytest -q

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      - name: validate registry.yaml
        run: uv run python scripts/validate_registry.py registry.yaml
      # gen_copier_yml.py is real (RegistryArchitect); copier.yml is generated and
      # committed. --check fails the build on any drift between registry.yaml (the
      # single source of truth) and the committed copier.yml - no --allow-missing.
      - name: copier.yml sync check
        run: uv run python scripts/gen_copier_yml.py --check registry.yaml

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      # Proves the render-twice-and-diff harness works against a trivial fixture,
      # independent of anything overlay-specific.
      - name: determinism (fixture, strict)
        run: >
          uv run python scripts/check_determinism.py
          --template tests/fixtures/determinism_fixture
          --answers-dir tests/fixtures/determinism_fixture/answers
          --strict
      # The real template, over every curated combo in ci/answers/. --strict: the
      # base template has landed, so a missing copier.yml here is a real failure,
      # not a soft skip.
      - name: determinism (generator template)
        run: >
          uv run python scripts/check_determinism.py
          --template .
          --answers-dir ci/answers
          --strict

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      # Contract confirmed by TestingHarness (Phase 1). Exit 0 when every executed
      # combo passes (SKIPPED combos are fine) or the generator is unavailable and
      # not --strict; exit 1 on a real combo failure. Today only the zero-overlay
      # combo executes; more activate as overlays reach build_status: implemented.
      - name: pairwise harness
        run: |
          if [ -f harness/run.py ]; then
            uv run python harness/run.py --mode pairwise --report-dir harness-report
          else
            echo "harness/run.py not present -> skip (Phase 1 slot only)"
          fi
      - name: upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness-report
          if-no-files-found: ignore

  update-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --frozen || uv sync
      # E2E against the fixture: real local tag pair, real `copier update`.
      # `uv run` puts the project venv (which has copier) on PATH for the script.
      - name: copier update verification (fixture)
        run: >
          uv run bash scripts/verify_update.sh
          --template-repo tests/fixtures/determinism_fixture
          --answers tests/fixtures/determinism_fixture/answers/default.yml
      # Real template, single-service: a genuine tag-to-tag `copier update` in a
      # scratch clone (v9000.0.0 -> v9000.0.1), not a HEAD-to-HEAD comparison.
      - name: copier update verification (generator template, single-service)
        run: uv run bash scripts/verify_update.sh --template-repo . --answers ci/answers/zero-overlay.yml
      # Real template, monorepo: same tag-to-tag mechanism but through
      # `msvc-gen update`'s multi-service orchestration (D-036) - N per-service
      # `copier update` runs plus the root-layer re-render. `uv run` puts the
      # project's own `msvc-gen` console script on PATH.
      - name: copier update verification (generator template, monorepo)
        run: uv run bash scripts/verify_update.sh --template-repo . --answers ci/answers/monorepo-2svc.yml
