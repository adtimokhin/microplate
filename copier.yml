# =============================================================================
# GENERATED by scripts/gen_copier_yml.py from registry.yaml. DO NOT EDIT.
#
# Regenerate:  python scripts/gen_copier_yml.py
# Check drift: python scripts/gen_copier_yml.py --check
#
# Every prompt here maps 1:1 to a registry key. Validation comes from
# registry.yaml `validation_rules` and per-option `requires`/`conflicts`.
# =============================================================================

_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_min_copier_version: "9.18.2"

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "/_fragments"
  - "/_fragments/**"

_skip_if_exists:
  - ".env"

# List-form argv, no shell (D-012).
_tasks:
  - command: ["uv", "lock"]
    when: "{{ _copier_operation == 'copy' }}"

# ---- base: Service basics ------------------------------------------
service_name:
  type: str
  help: "Service name (kebab-case, e.g. billing-api)"
  validator: >-
    {% if not (service_name | regex_search('^[a-z][a-z0-9-]{1,48}$')) %}
    service_name must match ^[a-z][a-z0-9-]{1,48}$
    {% endif %}

service_slug:
  type: str
  default: "{{ service_name }}"
  when: false

python_package:
  type: str
  default: "{{ service_slug | replace('-', '_') }}"
  when: false

python_version:
  type: str
  default: "3.12"
  when: false

api_rest:
  type: bool
  default: true
  when: false

license:
  type: str
  help: "License"
  choices:
    Proprietary: proprietary
    MIT: mit
    "Apache 2.0": apache_2_0
  default: "proprietary"

selected_overlays:
  type: json
  default: "{% from 'includes/answers_helpers.jinja' import selected_overlays with context %}{{ selected_overlays() }}"
  when: false

registry_version:
  type: int
  default: 0
  when: false

# ---- api: API layer ------------------------------------------------
api_grpc:
  type: bool
  help: "Add a gRPC server (protobuf defs + generated stubs)?"
  default: false

streaming_sse:
  type: bool
  help: "Add SSE streaming responses?"
  default: false
  validator: >-
    {% if (streaming_sse) and not (api_rest) %}
    REST API is required for SSE.
    {% endif %}

streaming_grpc:
  type: bool
  help: "Add gRPC streaming responses?"
  default: false
  validator: >-
    {% if (streaming_grpc) and not (api_grpc) %}
    Enable the gRPC server.
    {% endif %}

tool_scaffold:
  type: bool
  help: "Add function-call-shaped endpoint scaffold (OpenAPI tuned for tool use)?"
  default: false
  validator: >-
    {% if (tool_scaffold) and not (api_rest or api_grpc) %}
    Tool scaffold needs the REST API or the gRPC server.
    {% endif %}

mcp_server:
  type: bool
  help: "Expose selected endpoints as an MCP tool server?"
  default: false
  validator: >-
    {% if (mcp_server) and not (tool_scaffold or api_grpc) %}
    Enable the tool scaffold or the gRPC server.
    {% endif %}

# ---- data: Data layer ----------------------------------------------
db_postgres:
  type: bool
  help: "Add PostgreSQL (async SQLAlchemy 2.x + Alembic)?"
  default: false

db_mongodb:
  type: bool
  help: "Add MongoDB (PyMongo async client)?"
  default: false

db_redis:
  type: bool
  help: "Add Redis (cache + short-term state)?"
  default: false

redis_pubsub:
  type: bool
  help: "Include a Redis pub/sub helper?"
  default: false
  when: "db_redis"
  validator: >-
    {% if (redis_pubsub) and not (db_redis) %}
    Enable Redis.
    {% endif %}

db_qdrant:
  type: bool
  help: "Add Qdrant vector store (client + collection bootstrap)?"
  default: false

crud_scaffold:
  type: bool
  help: "Add a CRUD data-access scaffold (example entity + repository + REST endpoints)?"
  default: false
  validator: >-
    {% if crud_scaffold and not (db_postgres or db_mongodb or db_redis) %}
    CRUD scaffold needs a relational, document, or key-value store (db_postgres, db_mongodb, or db_redis).
    {% endif %}

crud_entity:
  type: str
  help: "CRUD example entity name (lower snake_case, e.g. item, widget, order)"
  default: "item"
  when: "crud_scaffold"

crud_backend:
  type: str
  default: "{% if db_postgres %}postgres{% elif db_mongodb %}mongodb{% else %}redis{% endif %}"
  when: false

# ---- messaging: Messaging ------------------------------------------
messaging_rabbitmq:
  type: bool
  help: "Add RabbitMQ (publisher/consumer scaffolding, DLQ + retry defaults)?"
  default: false

# ---- topology: Service topology ------------------------------------
topology:
  type: str
  help: "Service topology"
  choices:
    "Single service": single
    "Monorepo, multiple services": monorepo
    "Separate repo per service": multi_repo
  default: "single"
  validator: >-
    {% if (topology != 'single') and not (transport_grpc or transport_rabbitmq) %}
    Enable gRPC and/or RabbitMQ inter-service transport.
    {% endif %}

service_names:
  type: yaml
  help: "Service names (YAML list, e.g. [api, worker])"
  default: [api]
  when: "topology != 'single'"

transport_grpc:
  type: bool
  help: "Use gRPC for inter-service calls?"
  default: false
  when: "topology != 'single'"
  validator: >-
    {% if (topology != 'single') and not (transport_grpc or transport_rabbitmq) %}
    Enable gRPC and/or RabbitMQ inter-service transport.
    {% endif %}

transport_rabbitmq:
  type: bool
  help: "Use RabbitMQ for inter-service messaging?"
  default: "{{ true if topology != 'single' else false }}"
  when: "topology != 'single'"
  validator: >-
    {% if (topology != 'single') and not (transport_grpc or transport_rabbitmq) %}
    Enable gRPC and/or RabbitMQ inter-service transport.
    {% endif %}

services_config:
  type: json
  help: "Per-service overlay selections (JSON map service -> answers submap)"
  default: {}
  when: "topology != 'single'"

# ---- ai: AI system components --------------------------------------
llm_openai:
  type: bool
  help: "Add an OpenAI client (key config, retry, timeout, sample endpoint)?"
  default: false

llm_anthropic:
  type: bool
  help: "Add an Anthropic client (key config, retry, timeout, sample endpoint)?"
  default: false

prompt_management:
  type: bool
  help: "Add versioned prompt files + a prompt registry/loader?"
  default: false

langchain:
  type: bool
  help: "Add LangChain (prompt templates, output parsers, LLM calls)?"
  default: false
  validator: >-
    {% if (langchain) and not (llm_openai or llm_anthropic) %}
    Enable the OpenAI or Anthropic client.
    {% endif %}

langchain_retrieval:
  type: bool
  help: "Include a LangChain retrieval chain against Qdrant?"
  default: false
  when: "langchain"
  validator: >-
    {% if (langchain_retrieval) and not (langchain and db_qdrant) %}
    Enable LangChain and Qdrant.
    {% endif %}

embedding_pipeline:
  type: bool
  help: "Add an embedding pipeline (embedding client + ingestion job to Qdrant)?"
  default: false
  validator: >-
    {% if (embedding_pipeline) and not (db_qdrant) %}
    Enable Qdrant.
    {% endif %}

    {% if (embedding_pipeline) and not (embedding_backend == 'fastembed' or (embedding_backend == 'openai' and llm_openai)) %}
    Pick fastembed, or enable the OpenAI client for the openai embedding backend.
    {% endif %}

embedding_backend:
  type: str
  help: "Embedding backend"
  choices:
    "fastembed offline (bge-small, 384)": fastembed
    "OpenAI (text-embedding-3-small, 1536)": openai
  default: "fastembed"
  when: "embedding_pipeline"
  validator: >-
    {% if (embedding_pipeline) and not (embedding_backend == 'fastembed' or (embedding_backend == 'openai' and llm_openai)) %}
    Pick fastembed, or enable the OpenAI client for the openai embedding backend.
    {% endif %}

embedding_vector_size:
  type: int
  help: "Embedding vector size (Qdrant collection dimension)"
  default: 384
  when: "embedding_pipeline"
  validator: >-
    {% if not (embedding_backend != 'fastembed' or embedding_vector_size == 384) %}
    fastembed bge-small produces 384-dim vectors.
    {% endif %}

langgraph:
  type: bool
  help: "Add a minimal LangGraph stateful graph behind one route?"
  default: false
  validator: >-
    {% if (langgraph) and not (db_postgres or db_redis) %}
    Enable PostgreSQL or Redis for LangGraph checkpointing.
    {% endif %}

langgraph_checkpoint:
  type: str
  help: "LangGraph checkpoint store"
  choices:
    - postgres
    - redis
  default: "postgres"
  when: "langgraph"
  validator: >-
    {% if (langgraph) and not ((langgraph_checkpoint == 'postgres' and db_postgres) or (langgraph_checkpoint == 'redis' and db_redis)) %}
    Enable the datastore you picked for LangGraph checkpointing.
    {% endif %}

langsmith:
  type: bool
  help: "Add LangSmith tracing hooks?"
  default: false
  validator: >-
    {% if (langsmith) and not (llm_openai or llm_anthropic) %}
    Enable the OpenAI or Anthropic client.
    {% endif %}

# ---- testing: Testing ----------------------------------------------
tests_unit:
  type: bool
  help: "Unit test scaffolding (pytest + per-component mock fixtures)?"
  default: true

tests_integration:
  type: bool
  help: "Integration test scaffolding (pytest + testcontainers for selected deps)?"
  default: false

tests_contract:
  type: bool
  help: "gRPC contract tests (multi-service only)?"
  default: false
  when: "topology != 'single'"
  validator: >-
    {% if (tests_contract) and not (topology != 'single' and transport_grpc) %}
    Set a multi-service topology with gRPC transport.
    {% endif %}

llm_response_mode:
  type: str
  help: "LLM test response mode"
  choices:
    "httpx2 MockTransport": mock_transport
    "local fake server via *_BASE_URL": fake_server
  default: "mock_transport"
  when: "llm_openai or llm_anthropic or langchain or langgraph"

# ---- observability: Observability ----------------------------------
logging_structured:
  type: bool
  help: "Structured logging + correlation IDs?"
  default: true

otel_tracing:
  type: bool
  help: "OpenTelemetry tracing (SDK + FastAPI instrumentation + OTLP exporter)?"
  default: false

healthchecks:
  type: bool
  default: true
  when: false

# ---- packaging: Docker, CI, IaC ------------------------------------
docker:
  type: bool
  help: "Dockerfile + docker-compose (only selected deps)?"
  default: true

ci:
  type: str
  help: "CI pipeline template"
  choices:
    None: none
    "GitHub Actions": github_actions
  default: "github_actions"

iac:
  type: str
  help: "Infrastructure-as-code output"
  choices:
    None: none
    "docker-compose only": compose_only
  default: "none"
